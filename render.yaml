databases:
  - name: campus-asset-db
    databaseName: campus_asset_db
    user: postgres
    plan: free

services:
  - type: web
    name: campus-asset-iq
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn tracker.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-asset-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.12.0
